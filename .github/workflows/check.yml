name: Pārbaudīt plānotāju

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pārbaudīt sinhronizāciju un uzdevumu darbības
        run: node tests/sync-interactions.test.cjs
      - name: Pārbaudīt uzdevumu skatus un izkārtojumu
        run: node tests/planner-views.test.cjs
      - name: Pārbaudīt darba un ikdienas skatus
        run: node tests/workspaces-theme.test.cjs
      - name: Pārbaudīt kategorijas un laika secību
        run: node tests/categories-timing.test.cjs
      - name: Pārbaudīt kontu izolāciju un uzdevuma logu
        run: node tests/account-isolation-modal.test.cjs
      - name: Pārbaudīt dienas un laika atgādinājumus
        run: node tests/day-reminder.test.cjs
      - name: Pārbaudīt Latvijas vārdadienas
        run: node tests/namedays.test.cjs
