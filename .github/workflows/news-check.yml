name: Pārbaudīt ziņu logrīku
on:
  push:
    branches: [main]
  pull_request:
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/news-section.test.cjs tests/news-widget.test.cjs tests/industry-news.test.mjs tests/widgets.test.cjs tests/online-widgets.test.cjs
